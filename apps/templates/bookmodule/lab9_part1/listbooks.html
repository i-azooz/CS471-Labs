<style>
    table { width: 90%; margin: 20px auto; border-collapse: collapse; font-family: Arial, sans-serif; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
    th { background-color: #007bff; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    .btn { padding: 5px 10px; text-decoration: none; border-radius: 4px; color: white; }
    .edit-btn { background-color: #28a745; }
    .del-btn { background-color: #dc3545; }
</style>

<h2 style="text-align: center;">Books List</h2>
<div style="text-align: center;">
    <a href="{% url 'lab9_addbook' %}" style="padding: 10px; background: #007bff; color: white; text-decoration: none; border-radius: 5px;">+ Add New Book</a>
</div>

<table>
    <thead>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Price</th> <th>Quantity</th> <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>${{ book.price }}</td> <td>{{ book.quantity }}</td> <td>
                <a href="{% url 'lab9_editbook' book.id %}" class="btn edit-btn">Edit</a>
                <a href="{% url 'lab9_deletebook' book.id %}" class="btn del-btn" onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
